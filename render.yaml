# Render Blueprint do serviço pertinhos-oficial (plano GRÁTIS: serve para teste, NÃO para usuários reais).
# Para usuários reais use render.paid.yaml.example (disco permanente).
services:
  - type: web
    name: pertinhos-oficial
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci --include=dev && npm run build   # --include=dev: o minificador (terser) é dependência de desenvolvimento
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass                         # só publica depois que os testes do GitHub passam
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/pertinhos-data                        # temporário: some a cada reinício (plano grátis não tem disco)
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENTS_MODE
        value: "off"                                      # "demo" é recusado em produção; "asaas" só depois do teste no sandbox
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CPF_PEPPER                                   # OBRIGATÓRIO: sem ele o segredo do CPF muda a cada reinício
        sync: false
      - key: PUBLIC_URL
        sync: false
