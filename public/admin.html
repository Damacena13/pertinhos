<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pertinho ADM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/admin.html"><i></i>pertinho <span class="chip teal" style="font-size:.7rem">ADM</span></a>
    <div style="margin-left:auto;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <span id="who" class="hint"></span>
      <a class="btn ghost small" href="/">Ver o site</a>
      <button class="btn ghost small" id="logout" type="button" hidden>Sair</button>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Alternar tema claro e escuro"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</header>

<main class="wrap" style="padding-block:24px 56px">
  <section id="loginBox" class="loginbox" hidden>
    <h1 style="font-size:2rem">Painel de administração</h1>
    <p class="note">Acesso restrito à equipe do Pertinho.</p>
    <form id="loginForm" class="field" style="gap:1rem" novalidate>
      <div class="field"><label for="aEmail">E-mail</label><input type="text" id="aEmail" inputmode="email" autocomplete="username"></div>
      <div class="field"><label for="aPass">Senha</label><input type="password" id="aPass" autocomplete="current-password"></div>
      <p class="formerr" id="aErr" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </section>

  <section id="panel" hidden>
    <div class="tabs adm-tabs" role="tablist" aria-label="Seções do painel">
      <button class="tab" role="tab" data-s="resumo" aria-selected="true">Resumo</button>
      <button class="tab" role="tab" data-s="usuarios" aria-selected="false">Usuários</button>
      <button class="tab" role="tab" data-s="denuncias" aria-selected="false">Denúncias<span class="badge" id="repBadge" hidden>0</span></button>
      <button class="tab" role="tab" data-s="verificacoes" aria-selected="false">Verificações<span class="badge" id="verBadge" hidden>0</span></button>
      <button class="tab" role="tab" data-s="fotos" aria-selected="false">Fotos</button>
      <button class="tab" role="tab" data-s="convites" aria-selected="false">Convites</button>
      <button class="tab" role="tab" data-s="encontros" aria-selected="false">Encontros</button>
      <button class="tab" role="tab" data-s="assinaturas" aria-selected="false">Assinaturas</button>
      <button class="tab" role="tab" data-s="auditoria" aria-selected="false">Auditoria</button>
    </div>
    <div id="view" style="margin-top:1.4rem"></div>
  </section>
</main>

<div class="modal" id="userModal" role="dialog" aria-modal="true" aria-labelledby="umTitle" hidden>
  <div class="mbox wide" id="umBody"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/admin.js" defer></script>
</body>
</html>
